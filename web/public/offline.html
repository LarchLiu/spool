<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Spool</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Avenir Next", "PingFang SC", "Yu Gothic", sans-serif;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        background: light-dark(#f7f7f2, #242423);
        color: light-dark(#293b32, #d0d0ce);
      }
      main {
        padding: 30px;
        max-width: 430px;
      }
      h1 {
        font-size: 30px;
        font-weight: 600;
      }
      p {
        font-size: 15px;
        line-height: 1.9;
        opacity: 0.7;
      }
      a {
        color: inherit;
        line-height: 3;
      }
    </style>
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Spool" width="64" height="64" />
      <h1 id="offline-title">Pick up the conversation later.</h1>
      <p id="offline-detail">
        Cannot reach your desktop service. Make sure the computer is awake,
        Spool is running, and you are on the right network.
      </p>
      <p id="offline-task">
        Submitted tasks are not cancelled when your browser goes offline.
      </p>
      <a id="offline-reconnect" href="/">Reconnect →</a>
    </main>
  </body>
</html>
