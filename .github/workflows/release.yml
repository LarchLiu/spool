name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to retry an unfinished release (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_NOTES_FILE: RELEASE_NOTES.md

jobs:
  prepare:
    name: Verify and prepare release
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare installer security test dependencies
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Test release tooling
        run: node --test tools/*.test.mjs
      - name: Resolve published changelog base
        id: metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release-metadata.mjs
      - name: Generate release changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ steps.metadata.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          from="$PREVIOUS_RELEASE_TAG"
          if [[ -z "$from" ]]; then
            # Never let an unpublished tag become the changelog base.
            from="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          npx --yes changelogithub@14.0.0 --from "$from" --to "$RELEASE_TAG" --output "$RELEASE_NOTES_FILE"
      - name: Validate release version and public key
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: node tools/prepare-release.mjs --check
      - run: npm --prefix web ci
      - name: Build and test frontend
        run: |
          go run ./tools/branding.go
          npm --prefix web run build
          npm --prefix web test
      - name: Test Go packages with race detection
        run: go test -race -v -timeout=10m ./...
      - name: Vet Go packages
        run: go vet ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-resources
          path: |
            frontend/
            assets/icon.png
            tray.png
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin/arm64, target: darwin-arm64 }
          - { os: macos-latest, platform: darwin/amd64, target: darwin-amd64 }
          - { os: ubuntu-latest, platform: windows/amd64, target: windows-amd64 }
          - { os: ubuntu-latest, platform: windows/arm64, target: windows-arm64 }
          - { os: ubuntu-latest, platform: linux/amd64, target: linux-amd64 }
          - { os: ubuntu-latest, platform: linux/arm64, target: linux-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-resources
      - name: Install NSIS for Windows installers
        if: startsWith(matrix.target, 'windows-')
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Configure version, release notes and update public key
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: node tools/prepare-release.mjs
      - name: Build installers without signing secrets
        env:
          MYGO_LDFLAGS: >-
            -X spool/internal/appupdate.releaseRepository=${{ github.repository }}
            -X spool/internal/appupdate.releasePublicKey=${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: go run github.com/egoist/mygo/cmd/mygo@v0.6.4 build -platform "${{ matrix.platform }}" -skip-build-command -sign - -skip-notarize
      - name: Package unsigned update archive
        run: node tools/package-release.mjs "${{ matrix.target }}"
      - name: Collect release assets
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find "build/$TARGET" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.deb' -o -name '*Setup*.exe' \) -exec cp {} release-assets/ \;
      - name: Verify unsigned target assets
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: node tools/release-assets.mjs release-assets "${{ matrix.target }}" --unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Run ${{ matrix.target }} package
    needs: [prepare, build]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-amd64 }
          - { os: windows-latest, target: windows-amd64 }
          - { os: windows-11-arm, target: windows-arm64 }
          - { os: ubuntu-24.04, target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          architecture: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages-${{ matrix.target }}
          path: smoke-assets
      - name: Install Linux native runtime
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libgl1 libegl1 libgl1-mesa-dri libxkbcommon0 xvfb xauth dbus-x11
      - name: Launch packaged desktop and probe Web service
        env:
          TARGET: ${{ matrix.target }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a dbus-run-session -- node tools/smoke-release.mjs smoke-assets "$TARGET"
          else
            node tools/smoke-release.mjs smoke-assets "$TARGET"
          fi
      - name: Keep smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-${{ matrix.target }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [prepare, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize publication across tags so an older build cannot replace Latest.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - name: Sign and verify all six targets and metadata
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: node tools/sign-release.mjs
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Recheck publication state and Latest version
        id: metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release-metadata.mjs
      - name: Upload to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ steps.metadata.outputs.draft_id }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          MAKE_LATEST: ${{ steps.metadata.outputs.make_latest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRAFT_ID" ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "Spool $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE" --prerelease="$PRERELEASE" --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RELEASE_NOTES_FILE" --prerelease="$PRERELEASE"
          fi
          # The draft remains private until every upload succeeds.
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$PRERELEASE" --latest="$MAKE_LATEST"
