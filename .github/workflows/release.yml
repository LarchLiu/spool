name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to retry an unfinished release (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_NOTES_FILE: RELEASE_NOTES.md

jobs:
  prepare:
    name: Verify and prepare release
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Prepare installer security test dependencies
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Test release tooling
        run: bun test tools/*.test.mjs
      - name: Resolve published changelog base
        id: metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/release-metadata.mjs
      - name: Generate release changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ steps.metadata.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          from="$PREVIOUS_RELEASE_TAG"
          if [[ -z "$from" ]]; then
            # Never let an unpublished tag become the changelog base.
            from="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          bunx --bun changelogithub@14.0.0 --from "$from" --to "$RELEASE_TAG" --output "$RELEASE_NOTES_FILE"
      - name: Validate release version and public key
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: bun tools/prepare-release.mjs --check
      - run: bun run --bun --cwd web bun install --frozen-lockfile
      - name: Build and test frontend
        run: |
          go run ./tools/branding.go
          bun run --bun --cwd web build
          bun run --bun --cwd web test
      - name: Test Go packages with race detection
        run: go test -race -v -timeout=10m ./...
      - name: Vet Go packages
        run: go vet ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-resources
          path: |
            frontend/
            assets/icon.png
            tray.png
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin/arm64, target: darwin-arm64 }
          - { os: macos-latest, platform: darwin/amd64, target: darwin-amd64 }
          - { os: ubuntu-latest, platform: windows/amd64, target: windows-amd64 }
          - { os: ubuntu-latest, platform: windows/arm64, target: windows-arm64 }
          - { os: ubuntu-latest, platform: linux/amd64, target: linux-amd64 }
          - { os: ubuntu-latest, platform: linux/arm64, target: linux-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-resources
      - name: Install NSIS for Windows installers
        if: startsWith(matrix.target, 'windows-')
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Configure version, release notes and update public key
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: bun tools/prepare-release.mjs
      - name: Build installers without signing secrets
        env:
          MYGO_LDFLAGS: >-
            -X spool/internal/appupdate.releaseRepository=${{ github.repository }}
            -X spool/internal/appupdate.releasePublicKey=${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: go run github.com/egoist/mygo/cmd/mygo@v0.6.4 build -platform "${{ matrix.platform }}" -skip-build-command -sign - -skip-notarize
      - name: Package unsigned update archive
        run: bun tools/package-release.mjs "${{ matrix.target }}"
      - name: Build and package headless server (no GUI or CGO)
        run: bun tools/package-server.mjs "${{ matrix.target }}"
      - name: Collect release assets
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find "build/$TARGET" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.dmg' -o -name '*.deb' -o -name '*Setup*.exe' \) -exec cp {} release-assets/ \;
      - name: Verify unsigned target assets
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: bun tools/release-assets.mjs release-assets "${{ matrix.target }}" --unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android ARM64 APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sh android/tools/run.sh "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36.1' 'build-tools;36.1.0' 'ndk;29.0.14206865'
          # Hosted runners also export an older default NDK; override it explicitly.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build optimized APK without signing secrets
        run: sh android/tools/build.sh :app:assembleRelease :app:lintRelease
      - name: Verify APK contents and release version
        shell: bash
        run: |
          sh android/tools/run.sh bash <<'BASH'
          set -euo pipefail
          apk=build/android/gradle/app/outputs/apk/release/app-release-unsigned.apk
          bun android/tools/check-syntax-package.mjs --apk "$apk" --abis arm64-v8a
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$apk" > "$TMPDIR/apk-badging.txt"
          grep -F "package: name='com.cloudgeek.spool.android'" "$TMPDIR/apk-badging.txt"
          grep -F "versionName='${RELEASE_TAG#v}'" "$TMPDIR/apk-badging.txt"
          BASH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-unsigned
          path: build/android/gradle/app/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  relay:
    name: Relay ${{ matrix.image }} image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64, image: relay, context: relay }
          - { os: ubuntu-24.04-arm, arch: arm64, image: relay, context: relay }
          - { os: ubuntu-24.04, arch: amd64, image: caddy, context: relay/deploy/caddy }
          - { os: ubuntu-24.04-arm, arch: arm64, image: caddy, context: relay/deploy/caddy }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.image == 'relay'
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Test Relay and deployment configuration
        if: matrix.image == 'relay'
        run: |
          sh tools/run.sh relay-release-check sh -eu -c '
            go -C relay test -race -timeout=10m ./...
            go -C relay vet ./...
            bun test relay/test/deployment.test.mjs
          '
      - name: Validate embedded version and resolve image name
        id: image
        run: bun tools/relay-images.mjs prepare "${{ matrix.image }}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build native image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: spool-${{ matrix.image }}:release-check
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=relay-${{ matrix.image }}-${{ matrix.arch }}
      - name: Run native image smoke test
        run: sh tools/run.sh relay-image-smoke bun relay/test/image-smoke.mjs "${{ matrix.image }}" "spool-${{ matrix.image }}:release-check" "${{ steps.image.outputs.version }}"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push verified image by digest without moving release tags
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-to: type=gha,mode=max,scope=relay-${{ matrix.image }}-${{ matrix.arch }}
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: bun tools/relay-images.mjs record "${{ matrix.image }}" "${{ matrix.arch }}" build/relay-images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relay-image-${{ matrix.image }}-${{ matrix.arch }}
          path: build/relay-images/*.json
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Run ${{ matrix.target }} package
    needs: [prepare, build]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-amd64 }
          - { os: windows-latest, target: windows-amd64 }
          - { os: windows-11-arm, target: windows-arm64 }
          - { os: ubuntu-24.04, target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages-${{ matrix.target }}
          path: smoke-assets
      - name: Test smoke extraction and scratch cleanup
        shell: bash
        run: bun test tools/test-scratch.test.mjs tools/smoke-archive.test.mjs
      - name: Run headless server without a display
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: bun tools/smoke-server.mjs smoke-assets "${{ matrix.target }}"
      - name: Install Linux native runtime
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0 libgl1 libegl1 libgl1-mesa-dri libxkbcommon0 xvfb xauth dbus-x11
      - name: Launch packaged desktop and probe Web service
        env:
          TARGET: ${{ matrix.target }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a dbus-run-session -- bun tools/smoke-release.mjs smoke-assets "$TARGET"
          else
            bun tools/smoke-release.mjs smoke-assets "$TARGET"
          fi
      - name: Keep smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-${{ matrix.target }}
          path: |
            smoke-results/
            build/artifacts/server-smoke/
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [prepare, build, android, smoke, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize publication across tags so an older build cannot replace Latest.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - name: Sign and verify all desktop/server targets and metadata
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun tools/sign-release.mjs
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android signing tools
        run: sh android/tools/run.sh "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.1.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-unsigned
          path: android-unsigned
      - name: Sign and verify Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          sh android/tools/run.sh bash <<'BASH'
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Configure the $name Actions secret before releasing Android APKs." >&2
              exit 1
            fi
          done
          umask 077
          keystore="$TMPDIR/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          tools="$ANDROID_HOME/build-tools/36.1.0"
          apk="release-assets/spool-${RELEASE_TAG#v}-android-arm64.apk"
          "$tools/zipalign" -P 16 -f 4 android-unsigned/app-release-unsigned.apk "$TMPDIR/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false --out "$apk" "$TMPDIR/aligned.apk"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          BASH
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -- * > SHA256SUMS
      - name: Recheck publication state and Latest version
        id: metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/release-metadata.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: relay-image-*
          path: build/relay-images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish Relay and Caddy multi-platform image tags
        env:
          MAKE_LATEST: ${{ steps.metadata.outputs.make_latest }}
        run: bun tools/relay-images.mjs publish build/relay-images
      - name: Upload to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ steps.metadata.outputs.draft_id }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          MAKE_LATEST: ${{ steps.metadata.outputs.make_latest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRAFT_ID" ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "Spool $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE" --prerelease="$PRERELEASE" --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RELEASE_NOTES_FILE" --prerelease="$PRERELEASE"
          fi
          # The draft remains private until every upload succeeds.
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$PRERELEASE" --latest="$MAKE_LATEST"
