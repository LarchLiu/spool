name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build or retry before publication (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_NOTES_FILE: RELEASE_NOTES.md

jobs:
  prepare:
    name: Verify and prepare release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test release tooling
        run: node --test tools/*.test.mjs
      - name: Resolve published changelog base
        id: metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release-metadata.mjs
      - name: Generate release changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ steps.metadata.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          from="$PREVIOUS_RELEASE_TAG"
          if [[ -z "$from" ]]; then
            # Never let an unpublished tag become the changelog base.
            from="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          npx --yes changelogithub@14.0.0 --from "$from" --to "$RELEASE_TAG" --output "$RELEASE_NOTES_FILE"
      - name: Validate release version and signing keys
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: node tools/prepare-release.mjs
      - run: npm --prefix web ci
      - name: Build and test frontend
        run: |
          go run ./tools/branding.go
          npm --prefix web run build
          npm --prefix web test
      - name: Test and vet Go packages
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: release-resources
          path: |
            frontend/
            assets/icon.png
            tray.png
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin/arm64, target: darwin-arm64 }
          - { os: macos-latest, platform: darwin/amd64, target: darwin-amd64 }
          - { os: ubuntu-latest, platform: windows/amd64, target: windows-amd64 }
          - { os: ubuntu-latest, platform: windows/arm64, target: windows-arm64 }
          - { os: ubuntu-latest, platform: linux/amd64, target: linux-amd64 }
          - { os: ubuntu-latest, platform: linux/arm64, target: linux-arm64 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - uses: actions/download-artifact@v8
        with:
          name: release-resources
      - name: Install NSIS for Windows installers
        if: startsWith(matrix.target, 'windows-')
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Configure version, release notes and signed updates
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: node tools/prepare-release.mjs
      - name: Build installers and signed update archives
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go run github.com/egoist/mygo/cmd/mygo@v0.6.4 build -platform "${{ matrix.platform }}" -skip-build-command -sign - -skip-notarize
      - name: Collect release assets
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find "build/$TARGET" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.delta' -o -name '*.dmg' -o -name '*.deb' -o -name '*Setup*.exe' -o -name 'update-*.json' \) -exec cp {} release-assets/ \;
          if [[ "$TARGET" == linux-amd64 ]]; then
            cp "build/$TARGET/install.sh" release-assets/
          fi
      - name: Verify target assets and update signature
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: node tools/release-assets.mjs release-assets "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize publication across tags so an older build cannot replace Latest.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - name: Verify all six targets and update signatures
        env:
          MYGO_UPDATER_PUBLIC_KEY: ${{ vars.MYGO_UPDATER_PUBLIC_KEY }}
        run: node tools/release-assets.mjs
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Recheck publication state and Latest version
        id: metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release-metadata.mjs
      - name: Upload to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ steps.metadata.outputs.draft_id }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          MAKE_LATEST: ${{ steps.metadata.outputs.make_latest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRAFT_ID" ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "Spool $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE" --prerelease="$PRERELEASE" --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RELEASE_NOTES_FILE" --prerelease="$PRERELEASE"
          fi
          mapfile -d '' packages < <(find release-assets -type f ! -name 'update-*.json' -print0)
          mapfile -d '' manifests < <(find release-assets -type f -name 'update-*.json' -print0)
          gh release upload "$RELEASE_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" "${manifests[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$PRERELEASE" --latest="$MAKE_LATEST"
