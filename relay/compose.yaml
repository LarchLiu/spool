name: spool-relay

services:
  relay:
    build:
      context: .
    image: spool-relay:local
    restart: unless-stopped
    environment:
      SPOOL_RELAY_ADMIN_TOKEN: ${SPOOL_RELAY_ADMIN_TOKEN:?Set SPOOL_RELAY_ADMIN_TOKEN in .env}
      RELAY_REQUIRE_REGISTRATION_TOKEN: "${RELAY_REQUIRE_REGISTRATION_TOKEN:-true}"
      RELAY_TRUSTED_PROXIES: "${RELAY_TRUSTED_PROXIES:-}"
    command:
      - -listen=0.0.0.0:28080
      - -admin-listen=0.0.0.0:28081
      - -data-dir=/data
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:${RELAY_PORT:-28080}:28080"
      - "127.0.0.1:${RELAY_ADMIN_PORT:-28081}:28081"
    volumes:
      - relay-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  relay-data:
