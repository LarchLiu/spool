name: spool-relay

services:
  relay:
    build:
      context: .
    image: spool-relay:local
    restart: unless-stopped
    environment:
      SPOOL_RELAY_ADMIN_TOKEN: ${SPOOL_RELAY_ADMIN_TOKEN:?Set SPOOL_RELAY_ADMIN_TOKEN in .env}
      RELAY_REQUIRE_REGISTRATION_TOKEN: "${RELAY_REQUIRE_REGISTRATION_TOKEN:-true}"
      RELAY_PUBLIC_URL: "${RELAY_PUBLIC_URL:-}"
      RELAY_TRAEFIK_TOKEN: "${RELAY_TRAEFIK_TOKEN:-}"
      RELAY_TRAEFIK_RESOLVER: "${RELAY_TRAEFIK_RESOLVER:-letsencrypt}"
      RELAY_PROXY_UPSTREAM: "${RELAY_PROXY_UPSTREAM:-http://relay:28080}"
    command:
      - -listen=0.0.0.0:28080
      - -admin-listen=0.0.0.0:28081
      - -data-dir=/data
      - -proxy-listen=0.0.0.0:28082
    ports:
      - "127.0.0.1:${RELAY_PORT:-28080}:28080"
      - "127.0.0.1:${RELAY_ADMIN_PORT:-28081}:28081"
      - "127.0.0.1:${RELAY_PROXY_PORT:-28082}:28082"
    volumes:
      - relay-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    profiles: [caddy]
    build:
      context: ./deploy/caddy
    image: spool-relay-caddy:local
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      RELAY_PUBLIC_HOST: "${RELAY_PUBLIC_HOST:-}"
      RELAY_ADMIN_HOST: "${RELAY_ADMIN_HOST:-}"
      CADDY_CERTIFICATE_MODE: "${CADDY_CERTIFICATE_MODE:-individual}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
